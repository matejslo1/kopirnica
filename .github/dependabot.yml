# Dependabot: mesečne posodobitve, združene v PR-je (minor+patch / major).
# Varnostne posodobitve se združujejo v ločeni skupini (security-*).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      major:
        applies-to: version-updates
        update-types: [major]
      security-minor-and-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      security-major:
        applies-to: security-updates
        update-types: [major]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      major:
        applies-to: version-updates
        update-types: [major]
      security-minor-and-patch:
        applies-to: security-updates
        update-types: [minor, patch]
      security-major:
        applies-to: security-updates
        update-types: [major]
