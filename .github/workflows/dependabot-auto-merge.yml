name: Dependabot auto-merge

# Za Dependabot PR-je s patch/minor posodobitvijo vklopi GitHub auto-merge (squash).
# Merge se zgodi šele, ko so izpolnjeni pogoji branch protection (obvezni checki).
# Major posodobitve se nikoli ne mergeajo samodejno.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge ni omogočen v nastavitvah repoja
        if: github.event.repository.allow_auto_merge != true
        run: echo "::notice::Auto-merge je v nastavitvah repoja izklopljen – PR ostane za ročni pregled."

      - name: Vklopi auto-merge za patch/minor
        if: >-
          github.event.repository.allow_auto_merge == true &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
